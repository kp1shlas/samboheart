{% extends "base.html" %}
{% block title %}Новая группа — Сердце Самбо{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="/owner/groups/" class="text-sm text-accent hover:underline">
            ← К группам
        </a>
    </div>

    <h1 class="text-2xl font-bold mb-6">➕ Новая группа</h1>

    <form method="post"
          class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Название *
            </label>
            <input type="text" name="name" required
                   class="w-full px-4 py-2.5 border border-gray-300
                          rounded-xl focus:ring-2 focus:ring-red-500
                          focus:border-red-500 outline-none"
                   placeholder="Например: Самбо 7-9 лет">
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Цена за 1 занятие, ₽
                </label>
                <input type="number" name="price_per_lesson" value="500"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Абонемент 4 занятия, ₽
                </label>
                <input type="number" name="price_abonement_4" value="1800"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Макс. детей
                </label>
                <input type="number" name="max_capacity" value="20"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Преподаватель
                </label>
                <select name="teacher"
                        class="w-full px-4 py-2.5 border border-gray-300
                               rounded-xl focus:ring-2 focus:ring-red-500
                               focus:border-red-500 outline-none">
                    <option value="">— Не назначен —</option>
                    {% for t in teachers %}
                    <option value="{{ t.id }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Описание
            </label>
            <textarea name="description" rows="3"
                      class="w-full px-4 py-2.5 border border-gray-300
                             rounded-xl focus:ring-2 focus:ring-red-500
                             focus:border-red-500 outline-none"
                      placeholder="Необязательно"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-primary hover:bg-red-700
                       text-white font-medium py-3 rounded-xl transition">
            Создать группу
        </button>
    </form>
</div>
{% endblock %}
