{% extends "base.html" %}
{% block title %}Регистрация ребёнка — Сердце Самбо{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-6">
            <div class="text-5xl mb-3">👦</div>
            <h1 class="text-2xl font-bold">Регистрация ребёнка</h1>
            <p class="text-gray-600 text-sm mt-2">
                Создайте аккаунт, чтобы отслеживать свои занятия
            </p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    ФИО *
                </label>
                <input type="text" name="full_name" required
                       placeholder="Иванов Иван Иванович"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Дата рождения
                </label>
                <input type="date" name="birth_date"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Логин *
                </label>
                <input type="text" name="username" required
                       placeholder="ivanov_child"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email
                </label>
                <input type="email" name="email"
                       placeholder="ivanov@example.com"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Пароль *
                </label>
                <input type="password" name="password" required
                       minlength="5"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Повторите пароль *
                </label>
                <input type="password" name="password2" required
                       minlength="5"
                       class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none">
            </div>

            <button type="submit"
                    class="w-full bg-primary hover:bg-red-700
                           text-white font-semibold py-3 rounded-xl transition">
                Зарегистрироваться
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600 mb-2">Уже есть аккаунт?</p>
            <a href="/login/" class="text-primary hover:text-red-700 font-medium">
                Войти
            </a>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600">
                Вы родитель? 
                <a href="/register/" class="text-primary hover:text-red-700 font-medium">
                    Регистрация родителя
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
