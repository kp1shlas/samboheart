{% extends "base.html" %}
{% block title %}Вход — Сердце Самбо{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Вход</h1>
            <p class="text-gray-500 mt-1">Войдите в личный кабинет</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Логин
                </label>
                <input type="text" name="username" class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none transition" placeholder="Введите логин" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Пароль
                </label>
                <input type="password" name="password" class="w-full px-4 py-2.5 border border-gray-300
                              rounded-xl focus:ring-2 focus:ring-red-500
                              focus:border-red-500 outline-none transition" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-red-700
                           text-white font-medium py-3 px-4
                           rounded-xl transition">
                Войти
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600 mb-2">Нет аккаунта?</p>
            <a href="/register/" class="block text-primary hover:text-red-700 font-medium">
                Зарегистрироваться
            </a>
        </div>
    </div>
</div>
{% endblock %}
