{% extends "base.html" %}
{% block title %}Загрузить справку — Сердце Самбо{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="/dashboard/" class="text-sm text-accent hover:underline">
            ← Назад к кабинету
        </a>
    </div>

    <h1 class="text-2xl font-bold mb-6">📋 Загрузка справки</h1>

    <form method="post" enctype="multipart/form-data"
          class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Ребёнок
            </label>
            <select name="child"
                    class="w-full px-4 py-2.5 border border-gray-300
                           rounded-xl focus:ring-2 focus:ring-primary
                           focus:border-primary outline-none">
                {% for child in children %}
                <option value="{{ child.id }}">{{ child.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Файл справки (фото или PDF)
            </label>
            <input type="file" name="file" accept=".jpg,.jpeg,.png,.pdf"
                   class="w-full px-4 py-2.5 border border-gray-300
                          rounded-xl text-sm text-gray-500
                          file:mr-4 file:py-2 file:px-4
                          file:rounded-lg file:border-0
                          file:bg-primary file:text-white
                          file:text-sm file:font-medium
                          hover:file:bg-red-700"
                   required>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Пропуск с
            </label>
            <input type="date" name="date_from"
                   class="w-full px-4 py-2.5 border border-gray-300
                          rounded-xl focus:ring-2 focus:ring-primary
                          focus:border-primary outline-none">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Пропуск по
            </label>
            <input type="date" name="date_to"
                   class="w-full px-4 py-2.5 border border-gray-300
                          rounded-xl focus:ring-2 focus:ring-primary
                          focus:border-primary outline-none">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Комментарий (необязательно)
            </label>
            <textarea name="reason" rows="3"
                      class="w-full px-4 py-2.5 border border-gray-300
                             rounded-xl focus:ring-2 focus:ring-primary
                             focus:border-primary outline-none"
                      placeholder="Например: ОРВИ, справка от педиатра"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-primary hover:bg-red-700
                       text-white font-medium py-3 px-4
                       rounded-xl transition">
            Отправить на проверку
        </button>
    </form>
</div>
{% endblock %}
